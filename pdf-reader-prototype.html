.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #pdf-reader-screens {
      color-scheme: light dark;

      --reader-ink: light-dark(#20231f, #f1f3ed);
      --reader-muted: light-dark(#697069, #b8beb5);
      --reader-line: light-dark(#dde1d9, #434841);
      --reader-accent: light-dark(#3f684d, #9dc9a8);
      --reader-accent-soft: light-dark(#e5f0e7, #263e2b);
      --reader-yellow: light-dark(#fff0a8, #5f5223);
      --reader-shadow: light-dark(0 16px 38px rgb(35 45 37 / .11), 0 16px 38px rgb(0 0 0 / .3));
      font-family: ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Avenir Next&quot;, system-ui, sans-serif;
      width: 100%;
    }
    #pdf-reader-screens * { box-sizing: border-box; }
    #pdf-reader-screens .reader-window {
      background: var(--reader-paper);

      border-radius: 0;
      box-shadow: none;
      min-height: 650px;
      overflow: hidden;
      position: relative;
    }
    #pdf-reader-screens .topbar {
      align-items: center;
      border-bottom: 0;
      display: flex;
      gap: 12px;
      min-height: 66px;
      padding: 12px 22px;
    }
    #pdf-reader-screens .reader-window.is-reading { min-height: 780px; }
    #pdf-reader-screens .reader-window.is-reading .topbar { display: none; }
    #pdf-reader-screens .brand { color: var(--reader-ink); font-size: 19px; font-weight: 500; letter-spacing: -.03em; margin-right: 14px; }
    #pdf-reader-screens .tabs { display: flex; gap: 4px; }
    #pdf-reader-screens button { appearance: none; background: transparent; border: 0; border-radius: 9px; color: var(--reader-muted); cursor: pointer; font: inherit; padding: 9px 12px; }
    #pdf-reader-screens button:hover, #pdf-reader-screens button:focus-visible { background: var(--reader-accent-soft); color: var(--reader-ink); outline: none; }
    #pdf-reader-screens .tabs button[aria-selected=&quot;true&quot;] { background: var(--reader-accent-soft); color: var(--reader-accent); font-weight: 500; }
    #pdf-reader-screens .screen { display: none; }
    #pdf-reader-screens .screen.is-active { display: block; }
    #pdf-reader-screens .library { padding: 48px clamp(24px, 7vw, 112px); }
    #pdf-reader-screens .library-content { max-width: 940px; }
    #pdf-reader-screens h1 { color: var(--reader-ink); font-size: 30px; font-weight: 500; letter-spacing: -.045em; margin: 0; }
    #pdf-reader-screens .subcopy { color: var(--reader-muted); margin: 8px 0 22px; }
    #pdf-reader-screens .add-book { background: var(--reader-accent); color: light-dark(#fff, #122017); font-weight: 500; padding: 10px 15px; }
    #pdf-reader-screens .add-book:hover, #pdf-reader-screens .add-book:focus-visible { background: var(--reader-accent); color: light-dark(#fff, #122017); filter: brightness(1.08); }
    #pdf-reader-screens .book-list { border-top: 1px solid var(--reader-line); margin-top: 28px; }
    #pdf-reader-screens .book-row { align-items: center; border-bottom: 1px solid var(--reader-line); border-radius: 0; display: grid; gap: 18px; grid-template-columns: 54px minmax(0, 1fr) minmax(172px, auto); padding: 15px 4px; text-align: left; width: 100%; }
    #pdf-reader-screens .book-row:hover, #pdf-reader-screens .book-row:focus-visible { background: transparent; color: inherit; }
    #pdf-reader-screens .book-row:hover .book-title, #pdf-reader-screens .book-row:focus-visible .book-title { color: var(--reader-accent); }
    #pdf-reader-screens .cover { align-items: center; background: light-dark(#d9e6d8, #385243); border-radius: 5px 8px 8px 5px; display: flex; height: 72px; justify-content: center; overflow: hidden; width: 50px; }
    #pdf-reader-screens .cover img { display: block; height: 100%; object-fit: cover; width: 100%; }
    #pdf-reader-screens .cover.blue { background: #dce6ee; color: #35526a; font-family: Georgia, serif; font-size: 12px; text-align: center; }
    #pdf-reader-screens .book-details { min-width: 0; }
    #pdf-reader-screens .book-title { color: var(--reader-ink); display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pdf-reader-screens .book-meta { color: var(--reader-muted); display: block; margin-top: 5px; }
    #pdf-reader-screens .book-progress { color: var(--reader-muted); font-size: 14px; line-height: 1.45; text-align: right; }
    #pdf-reader-screens .book-progress strong { color: var(--reader-accent); display: block; font-weight: 500; }
    #pdf-reader-screens .reader { background: light-dark(#20231f, #090b09); min-height: 524px; padding: 0; position: relative; }
    #pdf-reader-screens .reader-window.is-reading .reader { min-height: 780px; }
    #pdf-reader-screens .reader-toolbar { align-items: center; background: linear-gradient(light-dark(rgb(27 31 27 / .82), rgb(20 22 20 / .9)), transparent); color: light-dark(#eef2eb, #eef2eb); display: flex; gap: 14px; left: 0; margin: 0; max-width: none; padding: 18px 6%; position: absolute; right: 0; top: 0; transition: opacity .18s ease, transform .18s ease; z-index: 2; }
    #pdf-reader-screens .reader-toolbar .book-label { color: #eef2eb; flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pdf-reader-screens .bookmark-action { background: light-dark(rgb(229 240 231 / .92), rgb(38 62 43 / .92)); color: light-dark(#254d31, #c4e2c9); font-weight: 500; white-space: nowrap; }
    #pdf-reader-screens .reader-back { color: #eef2eb; padding-left: 0; }
    #pdf-reader-screens .pdf-page { align-items: center; background: light-dark(#20231f, #090b09); display: flex; justify-content: center; margin: 0; min-height: 590px; padding: 14px; }
    #pdf-reader-screens .pdf-sheet { box-shadow: 0 6px 18px rgb(0 0 0 / .2); line-height: 0; max-height: 635px; max-width: 100%; position: relative; }
    #pdf-reader-screens .pdf-page img { display: block; height: auto; max-height: 635px; max-width: 100%; width: auto; }
    #pdf-reader-screens .reader-window.is-reading .pdf-page { min-height: 780px; padding: 12px; }
    #pdf-reader-screens .reader-window.is-reading .pdf-sheet, #pdf-reader-screens .reader-window.is-reading .pdf-page img { max-height: 756px; }
    #pdf-reader-screens .selection-highlight { background: light-dark(rgb(255 229 100 / .67), rgb(241 210 84 / .55)); display: none; height: 3.2%; left: 11%; position: absolute; top: 73%; width: 74%; }
    #pdf-reader-screens .reader.is-selecting .selection-highlight, #pdf-reader-screens .selection-highlight.is-persisted { display: block; }
    #pdf-reader-screens .selection-actions { background: light-dark(#ffffff, #282b27); border: 1px solid light-dark(#dce0d9, #50564d); border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / .2); display: none; left: 50%; line-height: normal; padding: 4px; position: absolute; top: 64%; transform: translateX(-50%); white-space: nowrap; z-index: 4; }
    #pdf-reader-screens .reader.is-selecting .selection-actions { display: flex; }
    #pdf-reader-screens .selection-actions button { color: var(--reader-ink); font-size: 13px; padding: 6px 9px; }
    #pdf-reader-screens .note-composer { background: light-dark(#ffffff, #282b27); border: 1px solid light-dark(#dce0d9, #50564d); border-radius: 12px; bottom: 50px; box-shadow: 0 9px 24px rgb(0 0 0 / .22); display: none; left: 50%; line-height: normal; padding: 14px; position: absolute; transform: translateX(-50%); width: min(330px, 88%); z-index: 5; }
    #pdf-reader-screens .reader.is-writing-note .note-composer { display: block; }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pdf-reader-screens&#x27;);
      const tabs = [...root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)];
      const screens = [...root.querySelectorAll(&#x27;[role=&quot;tabpanel&quot;]&#x27;)];
      const footerPage = root.querySelector(&#x27;#footer-page&#x27;);
      const bookmark = root.querySelector(&#x27;#go-bookmark&#x27;);
      const toast = root.querySelector(&#x27;#toast&#x27;);
      const reader = root.querySelector(&#x27;#reader-screen&#x27;);
      const readerWindow = root.querySelector(&#x27;.reader-window&#x27;);
      const showControls = root.querySelector(&#x27;#show-controls&#x27;);
      function showScreen(id) {
        readerWindow.classList.toggle(&#x27;is-reading&#x27;, id === &#x27;reader&#x27;);
        tabs.forEach((tab) =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.id === id + &#x27;-tab&#x27;)));
        screens.forEach((screen) =&gt; screen.classList.toggle(&#x27;is-active&#x27;, screen.id === id + &#x27;-screen&#x27;));
      }
      tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(tab.id.replace(&#x27;-tab&#x27;, &#x27;&#x27;))));
      root.querySelectorAll(&#x27;[data-open-book]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(&#x27;reader&#x27;)));
      root.querySelector(&#x27;#back-library&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showScreen(&#x27;library&#x27;));
      function flash(message) {
        toast.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
        window.setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1800);
      }
      function showSelection(withNote) {
        reader.classList.remove(&#x27;is-clean&#x27;);
        reader.classList.add(&#x27;is-selecting&#x27;);
        reader.classList.toggle(&#x27;is-writing-note&#x27;, Boolean(withNote));
        if (withNote) root.querySelector(&#x27;#annotation-note&#x27;).focus();
      }
      reader.querySelector(&#x27;.pdf-page&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (event.target.closest(&#x27;button, textarea&#x27;)) return;
        if (reader.classList.contains(&#x27;is-selecting&#x27;)) {
          reader.classList.remove(&#x27;is-selecting&#x27;, &#x27;is-writing-note&#x27;);
        } else {
          reader.classList.toggle(&#x27;is-clean&#x27;);
        }
      });
      showControls.addEventListener(&#x27;click&#x27;, () =&gt; reader.classList.remove(&#x27;is-clean&#x27;));
      bookmark.addEventListener(&#x27;click&#x27;, () =&gt; {
        footerPage.textContent = &#x27;100&#x27;;
        bookmark.textContent = &#x27;At bookmark · p. 80&#x27;;
      });
      root.querySelector(&#x27;#start-highlight&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showSelection(false));
      root.querySelector(&#x27;#start-note&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showSelection(true));
      root.querySelector(&#x27;#save-highlight&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        root.querySelector(&#x27;.selection-highlight&#x27;).classList.add(&#x27;is-persisted&#x27;);
        reader.classList.remove(&#x27;is-selecting&#x27;);
        flash(&#x27;Highlight saved&#x27;);
      });
      root.querySelector(&#x27;#open-note&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        reader.classList.add(&#x27;is-writing-note&#x27;);
        root.querySelector(&#x27;#annotation-note&#x27;).focus();
      });
      root.querySelector(&#x27;#cancel-note&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        reader.classList.remove(&#x27;is-writing-note&#x27;);
      });
      root.querySelector(&#x27;#save-note&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        root.querySelector(&#x27;.selection-highlight&#x27;).classList.add(&#x27;is-persisted&#x27;);
        reader.classList.remove(&#x27;is-selecting&#x27;, &#x27;is-writing-note&#x27;);
        flash(&#x27;Note saved&#x27;);
      });
      root.querySelector(&#x27;#choose-book&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; flash(&#x27;Google Drive picker would open here&#x27;));
    })();
  &lt;/script&gt;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
